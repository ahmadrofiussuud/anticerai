services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWGROUP: '1000'
    image: 'anticerai:latest'
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      LARAVEL_SAIL: 1
      APP_ENV: production
      APP_DEBUG: 'false'
    volumes:
      - './storage:/var/www/html/storage'
      - './bootstrap/cache:/var/www/html/bootstrap/cache'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge