services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: 'anticerai:latest'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
      - './storage:/var/www/html/storage'
      - './bootstrap/cache:/var/www/html/bootstrap/cache'
    networks:
      - sail
    depends_on:
      - mysql

  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-anticerai}'
      MYSQL_USER: '${DB_USERNAME:-sail}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './database/init:/docker-entrypoint-initdb.d'
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-password}']
      retries: 3
      timeout: 5s

  # Uncomment for local development with hot reloading
  # node:
  #   image: node:${NODE_VERSION:-24}-alpine
  #   working_dir: /var/www/html
  #   volumes:
  #     - '.:/var/www/html'
  #   ports:
  #     - '${VITE_PORT:-5173}:5173'
  #   command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  #   networks:
  #     - sail
  #   depends_on:
  #     - app

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local